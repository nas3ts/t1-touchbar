# T1 Touch Bar: skip the ASOC.SOCW(1) ACPI power-on — it HARD-FREEZES the
# MacBookPro14,3 T1 at module load. (The key finding; see ../README.md / the guide.)
options apple_ibridge skip_acpi_power=1

# Turn the bar off after 300 s with no internal keyboard/trackpad/touch-bar
# input; the next internal input turns it back on.  Set -1 to never turn it
# off, or -2 to turn the bar off completely.  (The T1 cannot dim, so it turns
# the whole bar off instead.)
options apple_touchbar idle_timeout=300
