# T1 Touch Bar: skip the ASOC.SOCW(1) ACPI power-on — it HARD-FREEZES the
# MacBookPro14,3 T1 at module load. (The key finding; see ../README.md / the guide.)
options apple_ibridge skip_acpi_power=1

# The idle timeout lives in apple-touchbar-idle.conf so that editing it is not
# undone when this file is reinstalled.
