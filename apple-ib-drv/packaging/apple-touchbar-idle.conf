# Touch Bar idle timeout: turn the bar off after 15 s with no internal
# keyboard/trackpad/touch-bar input; the next internal input turns it back on.
# Set -1 to never turn it off, or -2 to turn the bar off completely.
# (The T1 cannot dim, so it turns the whole bar off instead.)
#
# This lives in its own file so the installer can rewrite the freeze-guard
# conf (apple-touchbar.conf) without clobbering a value you changed here.
options apple_touchbar idle_timeout=15
